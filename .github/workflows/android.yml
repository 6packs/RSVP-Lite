# Tests every push. On main, a job that can only *read* the repo builds the
# signed release APK; a separate job, the only one allowed to write, attests
# it and replaces the "android-latest" release:
#   https://github.com/<owner>/<repo>/releases/tag/android-latest
# Actions are pinned to commits, since a tag can be moved.
name: Android

on:
  push:
    paths-ignore: ['**.md', 'docs/**'] # docs alone don't need a build
  workflow_dispatch:
    inputs:
      one_off_key:
        description: >-
          Sign with a throwaway key made for this one build, for when the
          secrets aren't set up yet. Nobody keeps the key, so nobody can sign
          an update for it — and installing a real-key build later needs one
          uninstall.
        type: boolean
        default: false

permissions: {} # each job asks for exactly what it needs

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04 # ships with the Android SDK
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

      - if: github.ref == 'refs/heads/main'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - if: github.ref == 'refs/heads/main'
        name: Build the signed release APK
        env:
          ONE_OFF: ${{ inputs.one_off_key }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          trap 'rm -f android/app/release.keystore' EXIT
          if [ "$ONE_OFF" = true ]; then
            ANDROID_KEYSTORE_PASSWORD=$(openssl rand -hex 32)
            keytool -genkeypair -keystore android/app/release.keystore -storetype PKCS12 -alias release \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=RSVP one-off build" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEYSTORE_PASSWORD
          elif [ -z "$KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets — see the README."
            exit 1
          else
            echo "$KEYSTORE" | base64 -d > android/app/release.keystore
          fi
          npx cap sync android
          (cd android && ./gradlew --no-daemon assembleRelease -PversionCode="$GITHUB_RUN_NUMBER")
          cp android/app/build/outputs/apk/release/app-release.apk rsvp-lite.apk
          sha256sum rsvp-lite.apk | tee rsvp-lite.apk.sha256
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: rsvp-lite.apk*
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to replace the release
      id-token: write # to sign the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apk
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: rsvp-lite.apk
      - name: Replace the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY_NOTE: ${{ inputs.one_off_key && 'Signed with a one-off key that was thrown away after this build. A later build signed with the permanent key needs one uninstall first.' || 'Signed with the permanent release key.' }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest rsvp-lite.apk rsvp-lite.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "RSVP Lite (Android, latest)" \
            --notes "Built from ${GITHUB_SHA::7} by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          On your phone: download rsvp-lite.apk below and open it to install or update.

          $KEY_NOTE

          SHA-256: \`$(cut -d' ' -f1 rsvp-lite.apk.sha256)\`

          To check that this APK is the one this repo built: \`gh attestation verify rsvp-lite.apk -R $GITHUB_REPOSITORY\`"
